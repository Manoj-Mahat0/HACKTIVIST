name: indoor_navigation
description: AR/VR Indoor Navigation Flutter App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  
  # Networking
  http: ^1.1.0
  dio: ^5.3.2
  connectivity_plus: ^5.0.2
  
  # Storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  
  # Location & AR
  geolocator: ^12.0.0
  permission_handler: ^11.0.1
  google_maps_flutter: ^2.5.0
  ar_flutter_plugin_2: ^0.0.3
  google_mlkit_text_recognition: ^0.11.0
  camera: ^0.10.5
  
  # Indoor Navigation - Compass & Pedometer
  flutter_compass: ^0.8.1
  pedometer: ^4.1.1
  flutter_tts: ^4.2.5
  sensors_plus: ^3.0.0
  
  # QR Code
  mobile_scanner: ^3.5.0
  qr_flutter: ^4.1.0
  
  # State Management & DI
  equatable: ^2.0.5
  get_it: ^7.6.4
  
  # Utils
  intl: ^0.18.1
  flutter_secure_storage: ^9.0.0
  uuid: ^4.0.0
  crypto: ^3.0.3
  dartz: ^0.10.1
  
  # PDF & Printing
  pdf: ^3.10.4
  printing: ^5.11.0
  
  # UI Components
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  tutorial_coach_mark: ^1.2.11
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  share_plus: ^7.2.1
  collection: ^1.18.0
  path_provider: ^2.1.1
  
# dependency_overrides:
#   flutter_sensors: ^3.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: "assets/images/logo.jpeg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.jpeg
  
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700